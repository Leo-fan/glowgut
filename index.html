<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>GlowGut Pro - Decode Your Body</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      /* Smooth scrolling and prevent bounce on mobile */
      html, body {
        overscroll-behavior-y: none;
        background-color: #F2F2F7; /* iOS System Gray 6 */
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }
      /* Hide scrollbar for clean UI */
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
      
      /* Apple-like smooth font rendering */
      body {
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
    </style>
</head>
  <body class="text-stone-900 antialiased h-screen w-screen overflow-hidden selection:bg-rose-500 selection:text-white">
    <div id="root" class="h-full w-full"></div>
  </body>
</html>
